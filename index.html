    <style>
      :root {
        /* Design system PS Tennis Team */
        --saibro: #a8492a;
        --lima: #d4f24a;
        --tinta: #1c1a17;
        --creme: #f4eee6;
        --grafite: #2a2723;
        --texto-no-escuro: #cfc6ba;
        --azul-quadra: #1f4e8c;
        --verde-quadra: #2f6b4f;

        --fonte-titulo:
          "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
        --fonte-texto:
          "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

        --margem: clamp(20px, 5vw, 56px);
      }

      /* Modo saibro: terracota + creme */
      [data-theme="saibro"] {
        --fundo: var(--saibro);
        --texto: var(--creme);
        --texto-2: var(--creme);
        --linha: rgba(244, 238, 230, 0.34);
        --piso: rgba(244, 238, 230, 0);
        --marca: rgba(28, 26, 23, 0.24);
        --trilho: rgba(28, 26, 23, 0.22);
      }

      /* Modo quadra rápida: entorno verde, quadra azul, linhas creme */
      [data-theme="rapida"] {
        --fundo: var(--verde-quadra);
        --texto: var(--creme);
        --texto-2: var(--creme);
        --linha: rgba(244, 238, 230, 0.5);
        --piso: var(--azul-quadra);
        --marca: rgba(28, 26, 23, 0.26);
        --trilho: rgba(28, 26, 23, 0.24);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        overflow-x: hidden;
      }

      body {
        position: relative;
        min-height: 100vh;
        min-height: 100svh;
        background: var(--fundo);
        color: var(--texto);
        font-family: var(--fonte-texto);
        -webkit-font-smoothing: antialiased;
        transition:
          background-color 0.6s ease,
          color 0.6s ease;
      }

      /* ---------- Quadra (elemento gráfico da marca) ---------- */
      .quadra {
        position: fixed;
        top: 50%;
        left: 50%;
        height: 94vh;
        height: 94svh;
        width: calc(94svh * 1297 / 2497);
        transform: translate(-50%, -50%);
        z-index: 0;
        pointer-events: none;
        overflow: visible;
      }
      @media (orientation: landscape) {
        .quadra {
          height: 96vw;
          width: calc(96vw * 1297 / 2497);
          transform: translate(-50%, -50%) rotate(90deg);
        }
      }
      .quadra .piso {
        fill: var(--piso);
        transition: fill 0.6s ease;
      }
      .quadra .l {
        fill: none;
        stroke: var(--linha);
        stroke-width: 4;
        stroke-linecap: square;
        stroke-dasharray: 1;
        stroke-dashoffset: 0;
        transition: stroke 0.6s ease;
      }
      .quadra .rede {
        stroke-width: 7;
      }
      .js .quadra .l {
        stroke-dashoffset: 1;
      }
      .js.desenha .quadra .l {
        animation: traca 1s cubic-bezier(0.6, 0, 0.2, 1) forwards;
        animation-delay: var(--d, 0s);
      }
      @keyframes traca {
        to {
          stroke-dashoffset: 0;
        }
      }

      /* ---------- Estrutura ---------- */
      .pagina {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: max(20px, env(safe-area-inset-top)) var(--margem)
          max(20px, env(safe-area-inset-bottom));
      }

      .topo,
      .rodape {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .logo {
        display: block;
        height: 48px;
        width: auto;
      }

      /* Seletor de modo */
      .tema {
        display: inline-flex;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: var(--trilho);
        transition: background-color 0.6s ease;
      }
      .tema button {
        min-height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--texto);
        font: 600 14px/1 var(--fonte-texto);
        white-space: nowrap;
        cursor: pointer;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }
      .tema button[aria-pressed="true"] {
        background: var(--lima);
        color: var(--tinta);
      }

      /* Centro */
      .centro {
        display: grid;
        place-content: center;
        justify-items: center;
        text-align: center;
        padding: 40px 0;
      }

      h1 {
        --bola: max(14px, 0.2em);
        --folga: 0.07em;
        margin: 0;
        font: 800 clamp(3.5rem, 16vw, 11.5rem)/0.9 var(--fonte-titulo);
        text-transform: uppercase;
        letter-spacing: 0.005em;
      }
      h1 .linha {
        display: block;
        white-space: nowrap;
      }
      /* espaço onde a bola pousa, como o ponto final do nome */
      h1 .linha-2::before,
      h1 .slot {
        content: "";
        display: inline-block;
        width: calc(var(--bola) + var(--folga));
        height: var(--bola);
        vertical-align: baseline;
      }

      .funcao {
        margin: 22px 0 0;
        font: 600 clamp(1.05rem, 3.4vw, 1.5rem)/1 var(--fonte-titulo);
        text-transform: uppercase;
        letter-spacing: 0.16em;
        padding-left: 0.16em; /* compensa o espaçamento da última letra */
      }

      .data {
        margin: 14px 0 0;
        font-size: clamp(1.1875rem, 2.4vw, 1.3125rem);
        line-height: 1.6;
        color: var(--texto-2);
        transition: color 0.6s ease;
      }

      .botao {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        margin-top: 34px;
        padding: 0 28px;
        border-radius: 999px;
        background: var(--lima);
        color: var(--tinta);
        font: 700 17px/1 var(--fonte-texto);
        text-decoration: none;
        transition: transform 0.2s ease;
      }
      .botao:hover {
        transform: translateY(-2px);
      }
      .botao svg {
        width: 20px;
        height: 20px;
        flex: none;
      }

      .rodape {
        font: 600 14px/1.4 var(--fonte-texto);
        color: var(--texto-2);
        transition: color 0.6s ease;
      }
      .rodape p {
        margin: 0;
      }
      .rodape a {
        color: inherit;
        text-underline-offset: 3px;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--texto);
        outline-offset: 3px;
      }

      /* ---------- Bola ---------- */
      .camada-bola {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
      }
      .bola,
      .sombra {
        display: none;
      }
      .js .bola,
      .js .sombra {
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        opacity: 0;
        will-change: transform;
      }
      .bola {
        padding: 0;
        border: 0;
        background: none;
        border-radius: 50%;
        cursor: pointer;
        pointer-events: auto;
      }
      .bola::before {
        /* área de toque maior que a bola */
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
      }
      .bola-squash,
      .bola svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .bola-squash {
        transform-origin: 50% 100%;
      }
      .sombra {
        border-radius: 50%;
        background: var(--marca);
        filter: blur(1px);
      }
      .js .bola.visivel,
      .js .sombra.visivel {
        opacity: 1;
      }

      .marca-bola {
        position: absolute;
        border-radius: 50%;
        background: var(--marca);
        animation: marca 1.6s ease-out forwards;
      }
      @keyframes marca {
        from {
          opacity: 1;
          transform: scale(0.55);
        }
        to {
          opacity: 0;
          transform: scale(1);
        }
      }

      /* ---------- Entradas ---------- */
      .js .revela {
        opacity: 0;
        transform: translateY(14px);
        transition:
          opacity 0.7s ease,
          transform 0.7s cubic-bezier(0.2, 0.7, 0.2, 1);
        transition-delay: var(--d, 0s);
      }
      .js .revela.on {
        opacity: 1;
        transform: none;
      }

      /* Reduzir movimento: tudo aparece parado */
      @media (prefers-reduced-motion: reduce) {
        .js .revela {
          opacity: 1;
          transform: none;
          transition: none;
        }
        .js .quadra .l {
          stroke-dashoffset: 0;
          animation: none;
        }
        .botao {
          transition: none;
        }
      }

      @media (max-width: 480px) {
        .rodape {
          flex-direction: column;
          gap: 6px;
          text-align: center;
        }
        .tema button {
          padding: 0 10px;
          font-size: 13px;
        }
        .logo {
          height: 30px;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        // EDITAR: data e hora em que o site completo entra no ar (horário de Brasília)
        var CONFIG = { lancamento: "2026-10-04T00:00:00-03:00" };

        var root = document.documentElement;
        var reduz = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        /* ---------- Modo de cor ---------- */
        var botoesTema = Array.prototype.slice.call(
          document.querySelectorAll("[data-tema]"),
        );
        var metaCor = document.querySelector('meta[name="theme-color"]');

        function aplicaTema(tema, salvar) {
          root.setAttribute("data-theme", tema);
          botoesTema.forEach(function (b) {
            b.setAttribute(
              "aria-pressed",
              b.getAttribute("data-tema") === tema ? "true" : "false",
            );
          });
          if (metaCor)
            metaCor.setAttribute(
              "content",
              tema === "rapida" ? "#2F6B4F" : "#A8492A",
            );
          if (salvar) {
            try {
              localStorage.setItem("ps-tema", tema);
            } catch (e) {}
          }
        }
        botoesTema.forEach(function (b) {
          b.addEventListener("click", function () {
            aplicaTema(b.getAttribute("data-tema"), true);
          });
        });
        aplicaTema(root.getAttribute("data-theme") || "saibro", false);

        /* ---------- Data ---------- */
        var data = document.getElementById("data");
        if (data && Date.now() >= new Date(CONFIG.lancamento).getTime()) {
          data.textContent = data.getAttribute("data-depois");
        }

        /* ---------- Bola ---------- */
        var G = 2600; // gravidade em px/s²
        var camada = document.querySelector(".camada-bola");
        var bola = document.querySelector(".bola");
        var squash = bola.querySelector(".bola-squash");
        var gira = bola.querySelector("svg");
        var sombra = document.querySelector(".sombra");
        var slot = document.querySelector(".slot");

        var tam = 20,
          sombraA = 6,
          alvoX = 0,
          chao = 0,
          giro = 0,
          animando = false;

        function mede() {
          var r = slot.getBoundingClientRect();
          tam = Math.max(12, Math.round(r.height));
          alvoX = r.right + window.scrollX - tam / 2;
          chao = r.bottom + window.scrollY;
          sombraA = Math.max(4, Math.round(tam * 0.28));
          bola.style.width = bola.style.height = tam + "px";
          sombra.style.width = tam + "px";
          sombra.style.height = sombraA + "px";
        }

        function posiciona(x, altura, rot, sx, sy) {
          bola.style.transform =
            "translate3d(" +
            (x - tam / 2) +
            "px," +
            (chao - altura - tam) +
            "px,0)";
          squash.style.transform = "scale(" + sx + "," + sy + ")";
          gira.style.transform = "rotate(" + rot + "rad)";
          var perto = Math.max(0, 1 - altura / 380);
          sombra.style.transform =
            "translate3d(" +
            (x - tam / 2) +
            "px," +
            (chao - sombraA / 2) +
            "px,0) scale(" +
            (0.45 + 0.55 * perto) +
            ")";
          sombra.style.opacity = (0.1 + 0.9 * perto).toFixed(3);
        }

        function marca(x, forca) {
          if (forca < 0.15) return;
          var m = document.createElement("span");
          var w = tam * (1.1 + forca);
          m.className = "marca-bola";
          m.setAttribute("aria-hidden", "true");
          m.style.width = w + "px";
          m.style.height = w * 0.32 + "px";
          m.style.left = x - w / 2 + "px";
          m.style.top = chao - w * 0.16 + "px";
          camada.insertBefore(m, sombra);
          m.addEventListener("animationend", function () {
            m.remove();
          });
        }

        function prepara(segs) {
          var acc = 0;
          segs.forEach(function (s) {
            s.dur = (s.tipo === "queda" ? 1 : 2) * Math.sqrt((2 * s.H) / G);
            acc += s.dur;
            s.fim = acc;
          });
          return acc;
        }

        // Física simples: queda livre + arcos parabólicos que perdem altura a cada quique
        function quica(segs, x0, vx, giroBase, giroExtra, aoTerminar) {
          var total = prepara(segs);
          var k = 0,
            tImpacto = -1,
            vImpacto = 0,
            t0 = null;
          animando = true;
          bola.classList.add("visivel");
          sombra.classList.add("visivel");

          function frame(agora) {
            if (t0 === null) t0 = agora;
            var t = (agora - t0) / 1000;
            var tc = Math.min(t, total);

            var i = 0,
              inicio = 0;
            while (i < segs.length - 1 && tc > segs[i].fim) {
              inicio = segs[i].fim;
              i++;
            }
            var s = segs[i],
              tl = tc - inicio,
              altura;
            if (s.tipo === "queda") altura = s.H - 0.5 * G * tl * tl;
            else {
              var v = Math.sqrt(2 * G * s.H);
              altura = v * tl - 0.5 * G * tl * tl;
            }
            altura = Math.max(0, altura);

            var x = x0 + vx * tc;

            while (k < segs.length && t >= segs[k].fim) {
              tImpacto = segs[k].fim;
              vImpacto = Math.sqrt(2 * G * segs[k].H);
              marca(x0 + vx * segs[k].fim, Math.min(1, vImpacto / 1800));
              k++;
            }

            var sx = 1,
              sy = 1;
            if (tImpacto >= 0 && t - tImpacto < 0.12) {
              var a =
                (1 - (t - tImpacto) / 0.12) * Math.min(0.28, vImpacto / 5000);
              sy = 1 - a;
              sx = 1 + a * 0.7;
            }

            giro = giroBase + (x - x0) / (tam / 2) + giroExtra * tc;
            posiciona(x, altura, giro, sx, sy);

            if (t < total + 0.12) requestAnimationFrame(frame);
            else {
              animando = false;
              posiciona(alvoX, 0, giro, 1, 1);
              if (aoTerminar) aoTerminar();
            }
          }
          requestAnimationFrame(frame);
        }

        function entradaDaBola(aoTerminar) {
          mede();
          var topo = window.scrollY + window.innerHeight * 0.06;
          var H0 = Math.max(120, chao - (topo + tam));
          var x0 = window.scrollX - tam * 2;
          var segs = [{ tipo: "queda", H: H0 }].concat(
            [0.48, 0.22, 0.09, 0.03].map(function (f) {
              return { tipo: "arco", H: H0 * f };
            }),
          );
          var total = prepara(segs);
          quica(segs, x0, (alvoX - x0) / total, 0, 0, aoTerminar);
        }

        bola.addEventListener("click", function () {
          if (animando || reduz) return;
          mede();
          var base = Math.min(
            170,
            Math.max(50, chao - window.scrollY - tam - 24),
          );
          var segs = [1, 0.42, 0.16, 0.05].map(function (f) {
            return { tipo: "arco", H: base * f };
          });
          quica(segs, alvoX, 0, giro, 6, null);
        });

        function reposiciona() {
          if (animando || !bola.classList.contains("visivel")) return;
          mede();
          posiciona(alvoX, 0, giro, 1, 1);
        }
        window.addEventListener("resize", reposiciona);
        if (document.fonts && document.fonts.addEventListener) {
          document.fonts.addEventListener("loadingdone", reposiciona);
        }

        /* ---------- Sequência de abertura ---------- */
        function revela(seletor, base, passo) {
          Array.prototype.forEach.call(
            document.querySelectorAll(seletor),
            function (el, i) {
              el.style.setProperty("--d", base + i * passo + "s");
              el.classList.add("on");
            },
          );
        }

        function inicia() {
          if (reduz) {
            revela(".revela", 0, 0);
            mede();
            bola.classList.add("visivel");
            sombra.classList.add("visivel");
            posiciona(alvoX, 0, 0, 1, 1);
            return;
          }
          root.classList.add("desenha"); // 1. linhas da quadra se desenham
          revela(".fase-1", 0.3, 0.15); // 2. nome aparece
          setTimeout(function () {
            // 3. bola entra quicando e vira o ponto final
            entradaDaBola(function () {
              revela(".fase-2", 0, 0.12); // 4. função, data, botão e rodapé
            });
          }, 1350);
        }

        var comecou = false;
        function vai() {
          if (!comecou) {
            comecou = true;
            inicia();
          }
        }
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(vai);
          setTimeout(vai, 1800);
        } else {
          vai();
        }
      })();
    </script>
  </body>
</html>
