<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1C1A17">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<!-- Área restrita do professor: sem link no site, fora do Google (noindex)
     e sem a tag do Google Ads, porque aqui circulam dados de alunos. -->

<title>Área do Professor · PS Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: direto e esportivo, como um bom treinador falando na quadra.
IDEA: a prancheta do professor: ficha de avaliação e relatório de jogo.
PICTURE: o desenho da quadra visto de cima e o radar dos golpes.
COLOUR and TYPE: saibro, tinta, creme, lima só para tocar; Barlow Condensed 800 + Figtree.
LAYOUT: uma coluna para o celular; relatório em páginas A4.
*/

:root{color-scheme:light;
  --saibro:#A8492A;--lima:#D4F24A;--tinta:#1C1A17;--creme:#F4EEE6;--grafite:#2A2723;--papel:#FBF8F3;
  --areia:#E6DCCF;--linha:#D9CFC2;--forte:#3F3A34;--suave:#5E574E;--noescuro:#CFC6BA;
  --tit:"Barlow Condensed","Arial Narrow",sans-serif;--txt:"Figtree",system-ui,sans-serif}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--creme);color:var(--tinta)}
body{font:16px/1.55 var(--txt);overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--tit);font-weight:800;text-transform:uppercase;line-height:.92;margin:0}
.over{font-family:var(--tit);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--saibro)}
[hidden]{display:none!important}

/* ---------- App ---------- */
.top{background:var(--tinta);color:var(--creme);padding:14px max(5vw,18px);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.top img{height:26px;width:auto;display:block}
.top .who{font-size:13px;font-weight:600;color:var(--noescuro)}
.top button{background:none;border:0;color:var(--noescuro);font-size:13px;font-weight:600;padding:10px 4px;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:22px max(5vw,18px) 120px}
.demo{background:var(--areia);color:var(--forte);border-radius:14px;padding:10px 14px;font-size:13px;line-height:1.45;margin-bottom:18px}
.demo b{color:var(--tinta)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;border:0;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn:focus-visible,.chip:focus-visible,.dot:focus-visible,input:focus-visible,textarea:focus-visible,.mic:focus-visible{outline:3px solid var(--saibro);outline-offset:2px}
.b-ink{background:var(--tinta);color:var(--creme)}
.b-lima{background:var(--lima);color:var(--tinta)}
.b-ghost{background:transparent;color:var(--tinta);border:1.5px solid var(--linha)}
.b-full{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* PIN */
.pin{min-height:100svh;background:var(--tinta);color:var(--creme);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;position:relative;overflow:hidden}
.pin .court{position:absolute;right:-170px;top:-60px;width:300px;opacity:.3;pointer-events:none}
.pin img{height:40px;margin-bottom:34px;position:relative}
.pin h1{font-size:44px;color:var(--creme);text-align:center;position:relative}
.pin p{color:var(--noescuro);font-size:15px;margin:10px 0 26px;text-align:center;position:relative}
.dots{display:flex;gap:14px;margin-bottom:26px;position:relative}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--noescuro)}
.dots i.on{background:var(--lima);border-color:var(--lima)}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;position:relative}
.pad button{height:64px;border-radius:999px;border:0;background:var(--grafite);color:var(--creme);font:700 24px var(--txt);cursor:pointer}
.pad button:active{background:#3a3631}
.pad .ghost{background:transparent;font-size:14px;color:var(--noescuro)}
.pin .err{color:var(--lima);font-weight:600;min-height:24px;margin-top:16px;position:relative}

/* Home */
.hero{background:var(--tinta);color:var(--creme);border-radius:28px;padding:26px 22px 22px;position:relative;overflow:hidden;margin-bottom:28px}
.hero .court{position:absolute;right:-70px;top:-60px;width:220px;opacity:.45;pointer-events:none}
.hero h1{font-size:40px;color:var(--creme);position:relative;max-width:12ch}
.hero p{color:var(--noescuro);margin:10px 0 20px;position:relative;font-size:15px;max-width:30ch}
.hero .btn{position:relative}
.secth{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px}
.secth h2{font-size:28px}
.search{width:100%;height:48px;border-radius:999px;border:1.5px solid var(--linha);background:var(--papel);padding:0 18px;font-size:16px;margin-bottom:14px}
.alunos{display:grid;gap:10px}
.al{display:flex;align-items:center;gap:14px;background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.al .av{width:46px;height:46px;border-radius:50%;background:var(--saibro);color:var(--creme);display:grid;place-items:center;font:800 20px var(--tit);flex:none}
.al .nm{font-weight:700;font-size:16px;line-height:1.25}
.al .meta{font-size:13px;color:var(--suave)}
.al .go{margin-left:auto;color:var(--suave);flex:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--areia);color:var(--forte);margin-top:4px}
.tag.ok{background:var(--tinta);color:var(--creme)}
.empty{color:var(--suave);font-size:15px;padding:18px 4px}

/* Form */
.prog{height:6px;background:var(--areia);border-radius:999px;overflow:hidden;margin:4px 0 20px}
.prog i{display:block;height:100%;background:var(--saibro);border-radius:999px;transition:width .3s}
.stepn{font-size:13px;font-weight:600;color:var(--suave);margin-bottom:4px}
.form h1{font-size:40px;margin-bottom:6px}
.form .lead{color:var(--suave);font-size:15px;margin:0 0 22px}
.fld{margin-bottom:22px}
.fld>label,.fld>.lb{display:block;font-weight:600;font-size:14px;margin-bottom:8px}
.fld .hint{font-weight:400;color:var(--suave)}
.inp{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--linha);background:var(--papel);padding:12px 14px;font-size:16px}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--linha);background:var(--papel);font-weight:600;font-size:15px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--creme)}
.golpe{background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:16px;margin-bottom:12px}
.golpe .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.golpe h3{font-size:24px;font-weight:700}
.golpe .lvl{font-size:13px;font-weight:600;color:var(--saibro)}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.dot{height:48px;border-radius:999px;border:1.5px solid var(--linha);background:var(--creme);font:700 18px var(--txt);cursor:pointer}
.dot[aria-pressed=true]{background:var(--tinta);border-color:var(--tinta);color:var(--creme)}
.golpe .more{margin-top:10px}
.golpe .more summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--suave);padding:6px 0;list-style:none}
.golpe .more summary::-webkit-details-marker{display:none}
.golpe .more summary::before{content:"+ "}
.golpe .more[open] summary::before{content:"− "}
.dict{position:relative}
.dict textarea{padding-right:62px}
.mic{position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:50%;border:0;background:var(--tinta);color:var(--creme);display:grid;place-items:center;cursor:pointer}
.mic.rec{background:var(--saibro);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(168,73,42,.18)}}
@media (prefers-reduced-motion:reduce){.mic.rec{animation:none}.btn,.prog i{transition:none}}
.mictip{font-size:13px;color:var(--suave);margin-top:6px}
.lock{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--areia);color:var(--forte);border-radius:999px;padding:3px 10px;margin-left:6px}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--papel);border:1.5px solid var(--linha);border-radius:22px;padding:16px;cursor:pointer;margin-bottom:12px}
.check input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--tinta)}
.check span{font-size:15px;line-height:1.45}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--creme);border-top:1px solid var(--linha);padding:12px max(5vw,18px) calc(12px + env(safe-area-inset-bottom));z-index:4}
.foot .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.foot .btn{flex:1}
.foot .b-ghost{flex:0 0 auto}

/* vídeo */
.vbox{background:var(--tinta);border-radius:22px;padding:14px;color:var(--creme)}
.vbox video{width:100%;max-height:360px;border-radius:14px;background:#000;display:block}
.vbox .vt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.vbox .vt .btn{min-height:46px;font-size:15px;padding:0 18px}
.up{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;border:2px dashed var(--linha);border-radius:22px;padding:30px 16px;background:var(--papel);cursor:pointer}
.up b{font-size:17px}
.up span{font-size:14px;color:var(--suave)}
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px;margin-top:14px}
.fr{position:relative;border-radius:14px;overflow:hidden;background:var(--areia);border:3px solid transparent;cursor:pointer;padding:0}
.fr.sel{border-color:var(--saibro)}
.fr img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.fr select{position:absolute;left:4px;right:4px;bottom:4px;font-size:12px;font-weight:700;border-radius:999px;border:0;background:var(--tinta);color:var(--creme);padding:4px 6px}
.fr .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(28,26,23,.75);color:var(--creme);font-weight:700;cursor:pointer}
.small{font-size:13px;color:var(--suave)}

/* gerando */
.gen{min-height:70svh;display:flex;flex-direction:column;justify-content:center}
.gen h1{font-size:44px;margin-bottom:22px}
.gen ol{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.gen li{display:flex;gap:12px;align-items:center;font-weight:600;color:var(--suave)}
.gen li i{width:26px;height:26px;border-radius:50%;border:2px solid var(--linha);flex:none;display:grid;place-items:center;font-style:normal;font-size:14px}
.gen li.on{color:var(--tinta)}
.gen li.on i{background:var(--tinta);border-color:var(--tinta);color:var(--creme)}

/* diagnóstico */
.dhead{background:var(--saibro);color:var(--creme);border-radius:28px;padding:24px 22px;position:relative;overflow:hidden;margin-bottom:20px}
.dhead .court{position:absolute;right:-100px;top:-80px;width:200px;opacity:.4;pointer-events:none}
.dhead .over{color:var(--creme);opacity:.85}
.dhead h1{font-size:44px;color:var(--creme);margin:6px 0 8px;position:relative}
.dhead p{margin:0;color:var(--creme);font-size:14px;position:relative}
.acts{display:grid;gap:10px;margin-bottom:26px}
.card{background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:18px;margin-bottom:12px}
.card h3{font-size:22px;font-weight:700;margin-bottom:8px}
.card ul{margin:0;padding-left:18px}
.card li{margin-bottom:4px}
.note{background:var(--areia);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--forte);margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(28,26,23,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal .box{background:var(--creme);border-radius:28px;padding:24px 22px;max-width:520px;width:100%}
.modal h2{font-size:30px;margin-bottom:10px}
.modal p{color:var(--forte);margin:0 0 18px}

/* ---------- Relatório (A4) ---------- */
.rbar{position:sticky;top:0;z-index:6;background:var(--tinta);color:var(--creme);padding:10px max(4vw,14px);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rbar .btn{min-height:44px;font-size:15px;padding:0 18px}
.rbar .msg{font-size:13px;color:var(--noescuro);flex-basis:100%}
.rstage{padding:18px 0 40px;background:#d8d0c5}
.rpages{width:210mm;margin:0 auto}
.pg{width:210mm;height:297mm;position:relative;overflow:hidden;background:var(--creme);color:var(--tinta);margin:0 auto 14px;box-shadow:0 4px 24px rgba(28,26,23,.18);font:10.5pt/1.5 var(--txt);break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg h1,.pg h2,.pg h3{font-family:var(--tit);text-transform:uppercase;line-height:.92}
.pg .in{position:absolute;inset:16mm 16mm 18mm}
.pg .rodape{position:absolute;left:16mm;right:16mm;bottom:9mm;display:flex;justify-content:space-between;font-size:7.5pt;font-weight:600;color:var(--suave)}
.pg .rodape b{color:var(--saibro);font-weight:700}
.pg .ov{font-family:var(--tit);font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:9pt;color:var(--saibro)}
.pg .h{font-size:34pt;font-weight:800;margin:2mm 0 6mm}
.pg p{margin:0}
.court{display:block}

.capa .topo{position:absolute;left:0;right:0;top:0;height:170mm;background:var(--tinta);color:var(--creme);overflow:hidden}
.capa .topo .court{position:absolute;right:-24mm;top:-10mm;width:92mm;opacity:.42}
.capa .logo{position:absolute;left:16mm;top:16mm;height:11mm}
.capa .tt{position:absolute;left:16mm;right:16mm;bottom:16mm}
.pill{display:inline-block;font-family:var(--txt);font-weight:700;font-size:8.5pt;padding:1.6mm 4mm;border-radius:999px}
.p-saibro{background:var(--saibro);color:var(--creme)}
.p-tinta{background:var(--tinta);color:var(--creme)}
.p-areia{background:var(--areia);color:var(--forte)}
.capa h1{font-size:62pt;font-weight:800;color:var(--creme);margin:5mm 0 2mm}
.capa .sub{font-family:var(--tit);font-weight:800;font-size:24pt;text-transform:uppercase;color:var(--noescuro);line-height:.95}
.capa .nome{font-family:var(--tit);font-weight:800;font-size:34pt;text-transform:uppercase;color:var(--lima);line-height:.95;margin-top:9mm}
.capa .quando{color:var(--noescuro);font-size:10pt;margin-top:2mm}
.capa .base{position:absolute;left:16mm;right:16mm;top:180mm;bottom:20mm}
.perfil{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3mm;margin:3mm 0 7mm}
.perfil div{background:var(--areia);border-radius:14px;padding:3mm 3.4mm}
.perfil small{display:block;font-size:7pt;font-weight:600;color:var(--suave);text-transform:none}
.perfil b{display:block;font-size:9.5pt;line-height:1.25}
.resumo{font-size:11.5pt;line-height:1.55;color:var(--forte);max-width:165mm}
.exemplo{position:absolute;right:16mm;top:18mm;font-size:7.5pt;font-weight:600;color:var(--noescuro)}

.jogo .grid{display:grid;grid-template-columns:116mm minmax(0,1fr);gap:7mm;align-items:center}
.radarbox{background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:4mm}
.radarbox svg{width:100%;height:auto;display:block}
.notas{display:grid;gap:3.6mm;padding-top:2mm}
.nt{display:grid;grid-template-columns:30mm minmax(0,1fr);align-items:center;gap:3mm}
.nt span{font-weight:700;font-size:10.5pt}
.nt .bar{display:flex;gap:1.4mm}
.nt .bar i{flex:1;height:4.2mm;border-radius:999px;background:var(--areia)}
.nt .bar i.on{background:var(--saibro)}
.escala{font-size:7.5pt;color:var(--suave);margin-top:5mm;line-height:1.5}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5mm;margin-top:10mm}
.jogo .bx{padding:7mm}.jogo .bx li{font-size:11pt}.jogo .bx ol{gap:4.4mm}
.bx{border-radius:22px;padding:6mm}
.bx h3{font-size:18pt;font-weight:800;margin-bottom:4mm}
.bx ol{margin:0;padding:0;list-style:none;display:grid;gap:3.4mm}
.bx li{display:grid;grid-template-columns:7mm minmax(0,1fr);gap:2mm;font-size:10.5pt;line-height:1.5}
.bx li b{font-family:var(--tit);font-weight:800;font-size:16pt;line-height:1}
.bx-claro{background:var(--papel);border:1px solid var(--linha)}
.bx-claro li b{color:var(--saibro)}
.bx-escuro{background:var(--tinta);color:var(--creme)}
.bx-escuro h3{color:var(--creme)}
.bx-escuro li{color:var(--noescuro)}
.bx-escuro li b{color:var(--lima)}

.golpes .cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5mm}
.gc{background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:5mm;display:flex;flex-direction:column;gap:3mm}
.gc .gt{display:flex;justify-content:space-between;align-items:center;gap:3mm}
.gc h3{font-size:19pt;font-weight:700}
.gc .mini{display:flex;gap:1mm}
.gc .mini i{width:4.4mm;height:4.4mm;border-radius:50%;background:var(--areia)}
.gc .mini i.on{background:var(--saibro)}
.gc .lb{font-size:7.5pt;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.08em}
.gc p{font-size:9.5pt;line-height:1.45;color:var(--forte)}
.corr{background:var(--tinta);color:var(--creme);border-radius:14px;padding:4mm;margin-top:auto}
.corr .k{font-family:var(--tit);font-weight:700;font-size:10pt;letter-spacing:.1em;text-transform:uppercase;color:var(--lima);margin-bottom:1.4mm}
.corr p{color:var(--creme);font-size:9.3pt}
.corr .ex{color:var(--noescuro);font-size:8.5pt;margin-top:2mm}

.outros{margin-top:6mm;background:var(--areia);border-radius:22px;padding:5mm 6mm}
.outros h3{font-size:15pt;font-weight:800;margin-bottom:3mm}
.outros .ls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3mm 6mm}
.outros .it{display:flex;justify-content:space-between;align-items:center;gap:3mm;font-weight:700;font-size:10pt}
.outros .it small{display:block;font-weight:500;font-size:8pt;color:var(--suave)}
.outros .mini{display:flex;gap:1mm}.outros .mini i{width:3.6mm;height:3.6mm;border-radius:50%;background:var(--creme)}.outros .mini i.on{background:var(--saibro)}
.saque .qs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3.4mm;margin-bottom:7mm}
.q .im{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--areia);position:relative}
.q .im img{width:100%;height:100%;object-fit:cover;display:block}
.q .im .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:7pt;font-weight:600;color:var(--suave);padding:2mm}
.q .im .ph svg{position:absolute;inset:3mm;width:calc(100% - 6mm);height:calc(100% - 6mm);opacity:.6}
.q .pill{margin:2.6mm 0 1.6mm}
.q p{font-size:8.4pt;line-height:1.4;color:var(--forte)}
.prio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:5mm}
.bx-saibro{background:var(--saibro);color:var(--creme)}
.bx-saibro h3{color:var(--creme)}
.bx-saibro .k{font-family:var(--tit);font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--lima);font-size:10pt;margin-bottom:2mm}
.bx p.t{font-size:10pt;line-height:1.5}

.plano .fases{display:grid;gap:4mm}
.fase{display:grid;grid-template-columns:34mm minmax(0,1fr);gap:5mm;background:var(--papel);border:1px solid var(--linha);border-radius:22px;padding:5mm}

/* ---------- Itens avaliados (alinhados ao ITN da ITF) ----------
   p = peso na média ponderada. Golpes e componentes do jogo seguem

   a descrição de níveis (saque, devolução, fundo, rede, passada). */
const ITENS = [
  { k:'Forehand', g:'golpes', p:1.2, d:'Consistência, profundidade e direção' },

const FAIXAS = [ { c:'6ª', ate:2.9, itn:'ITN 9 a 10' }, { c:'5ª', ate:4.2, itn:'ITN 8' }, { c:'4ª', ate:5.5, itn:'ITN 7' },

  '4ª': ['Forehand razoavelmente sólido, com intenção de direção.', 'Backhand consistente em bolas de ritmo moderado.', 'Ir à rede quando necessário, com voleio de forehand consistente.'],
  '3ª': ['Direção controlada em bolas de ritmo moderado e mais profundidade.', 'Saque com controle e alguma potência, começando a usar efeito.', 'Devolução consistente contra saques de ritmo médio.'],
  '2ª': ['Forehand profundo e controlado, com consistência.', 'Saques colocados, com primeiro saque potente.', 'Aproximações agressivas e voleio de forehand profundo.'],
  '1ª': ['Gerar potência e efeito com consistência, controlando o ritmo.', 'Saques ofensivos, com poucas duplas faltas.', 'Adaptar o plano de jogo a cada adversário.']
};
const nivelNota = n => !n ? '' : n <= 2 ? 'Começando' : n <= 4 ? 'Em desenvolvimento' : n <= 6 ? 'Funcional' : n <= 8 ? 'Consistente' : 'Avançado';
const idxC = c => CLASSES.indexOf(c);
const proxima = c => CLASSES[Math.min(idxC(c) + 1, CLASSES.length - 1)];
function calibrar(notas) {
  let s = 0, w = 0;
  notas.forEach(n => { const it = ITENS.find(i => i.k === n.golpe); if (it && n.nota) { s += n.nota * it.p; w += it.p; } });
  if (!w) return null;
  const media = Math.round(s / w * 10) / 10;
  const itn = Math.max(3, Math.min(10, 10 - (media - 1) * 7 / 9));
  const classe = FAIXAS.find(f => media <= f.ate).c;
  const nivel = itn > 9 ? 'Principiante' : itn > 7.5 ? 'Iniciante' : itn > 4.5 ? 'Intermediário' : 'Avançado';
  return { media, itn: Math.round(itn * 2) / 2, classe, nivel, itens: notas.filter(n => n.nota).length };
}

let TOKEN = '', CONTA = '';
async function api(action, payload = {}) {
  const r = await fetch(CONFIG.API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: TOKEN, ...payload }) });
  const j = await r.json();
  if (j.erro === 'sessao') { TOKEN = ''; go('login'); throw new Error('Sua sessão expirou. Entre de novo.'); }
  if (!j.ok) throw new Error(j.erro || 'Falha na comunicação');
  return j;
}
let gisPronto = null;
function carregarGoogle() {
  if (gisPronto) return gisPronto;
  gisPronto = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return gisPronto;
}
async function montarBotaoGoogle() {
  try {
    await carregarGoogle();
    google.accounts.id.initialize({ client_id: CONFIG.GOOGLE_CLIENT_ID, callback: r => { TOKEN = r.credential; entrar(); } });
    google.accounts.id.renderButton($('#gbtn'), { theme:'filled_black', shape:'pill', size:'large', text:'signin_with', locale:'pt-BR', width: 280 });
  } catch (e) { $('#lerr').textContent = 'Não consegui carregar o login do Google. Verifique a internet e recarregue a página.'; }
}
async function entrar() {
  const err = $('#lerr'); if (err) err.textContent = '';
  try {
    if (DEMO) { CONTA = CONFIG.CONTA_DEMO; }
    else { const r = await api('entrar'); CONTA = r.email; db = { alunos: r.alunos || [] }; }
    go('home');
  } catch (e) { TOKEN = ''; if (err) err.textContent = e.message; }
}

/* ---------- Ditado por voz ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function ditar(btn) {
  const alvo = document.getElementById(btn.dataset.mic);
  if (!SR) { const t = $('#mictip'); t && (t.textContent = 'Neste aparelho, use o microfone do próprio teclado para ditar.'); alvo.focus(); return; }
  if (rec) { rec.stop(); return; }
  try {
    rec = new SR(); rec.lang = 'pt-BR'; rec.continuous = true; rec.interimResults = true;
    const base = alvo.value ? alvo.value.replace(/\s*$/, ' ') : '';
    rec.onresult = ev => { let txt = ''; for (let i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript; alvo.value = base + txt; alvo.dispatchEvent(new Event('input', { bubbles:true })); };
    const fim = () => { btn.classList.remove('rec'); rec = null; };
    rec.onend = fim; rec.onerror = () => { fim(); alvo.focus(); };
    rec.start(); btn.classList.add('rec');
  } catch (e) { rec = null; alvo.focus(); }
}

/* ---------- Vídeo: extração de quadros ---------- */
let vurl = null;
function capturar(video) {
  const w = Math.min(720, video.videoWidth || 720), h = Math.round(w * (video.videoHeight || 1280) / (video.videoWidth || 720));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(video, 0, 0, w, h);
  return c.toDataURL('image/jpeg', 0.74);
}
const seek = (v, t) => new Promise(res => { const f = () => { v.removeEventListener('seeked', f); setTimeout(res, 60); }; v.addEventListener('seeked', f); v.currentTime = t; });
async function carregarVideo(file) {
  if (vurl) URL.revokeObjectURL(vurl);
  vurl = URL.createObjectURL(file);
  S.av._video = true; S.av.quadros = []; S.qsel = null; render();
  const v = $('#vid'); v.src = vurl;
  await new Promise(r => { v.onloadeddata = r; v.onerror = r; });
  try { await v.play(); v.pause(); } catch (e) {}
  const dur = v.duration && isFinite(v.duration) ? v.duration : 0;
  if (!dur || !v.videoWidth) { $('#frames').innerHTML = '<p class="small">Não consegui ler este vídeo aqui. Tente outro arquivo ou avance sem vídeo.</p>'; return; }
  const pts = [0.12, 0.32, 0.48, 0.62, 0.82];
  for (let i = 0; i < pts.length; i++) { await seek(v, dur * pts[i]); S.av.quadros.push({ fase: FASES[i], t: dur * pts[i], img: capturar(v) }); }
  await seek(v, 0); S.qsel = 0;
  $('#frames').innerHTML = quadrosHTML(S.av);
}

/* ---------- Relatório A4 ---------- */
function radar(notas, anterior) {
  const n = notas.length, cx = 180, cy = 168, R = 112;
  const pt = (i, r) => { const a = (-90 + i * 360 / n) * Math.PI / 180; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };

    if (a === 'gerar') { if (rec) rec.stop(); return gerar(); }
    if (t.dataset.chip) { const c = t.dataset.chip; S.av[c] = S.av[c] === t.dataset.v ? '' : t.dataset.v; t.parentElement.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', S.av[c] === b.dataset.v)); return estado(); }
    if (t.dataset.g) { const g = S.av.golpes[t.dataset.g]; g.nota = +t.dataset.n; t.parentElement.querySelectorAll('.dot').forEach(b => b.setAttribute('aria-pressed', +b.dataset.n === g.nota)); t.closest('.golpe').querySelector('.lvl').textContent = `${g.nota} · ${nivelNota(g.nota)}`; return estado(); }
    if (t.dataset.mic) return ditar(t);
    if (a === 'vpick') return $('#vfile').click();
    if (t.dataset.qx !== undefined) { ev.stopPropagation(); S.av.quadros.splice(+t.dataset.qx, 1); S.qsel = null; $('#frames').innerHTML = quadrosHTML(S.av); return; }
    if (t.dataset.q !== undefined && ev.target.tagName !== 'SELECT') { S.qsel = +t.dataset.q; const v = $('#vid'); const q = S.av.quadros[S.qsel]; if (v && q && q.t != null) v.currentTime = q.t; $('#frames').innerHTML = quadrosHTML(S.av); return; }
    if (a === 'vmark') { const v = $('#vid'); if (!v || !v.videoWidth) return; v.pause(); const q = { fase: FASES[Math.min(S.av.quadros.length, 4)], t: v.currentTime, img: capturar(v) };
      if (S.qsel != null && S.av.quadros[S.qsel]) { q.fase = S.av.quadros[S.qsel].fase; S.av.quadros[S.qsel] = q; } else if (S.av.quadros.length < 5) { S.av.quadros.push(q); S.qsel = S.av.quadros.length - 1; }
      $('#frames').innerHTML = quadrosHTML(S.av); return; }
    if (a === 'pdf' || a === 'doc') {
      const al = db.alunos.find(x => x.id === S.alunoId); const au = al && al.aulas.find(x => x.id === t.dataset.aula); if (!au) return;
      if (a === 'doc') { if (au.docUrl) { window.open(au.docUrl, '_blank', 'noopener'); return; }
        return modal('Editar o texto', 'Na versão final, este botão abre o diagnóstico como Google Doc, guardado na pasta do aluno no Drive. Você corrige o que quiser lá, volta aqui e toca em "Ver e salvar o PDF": o PDF sai com o texto já editado.'); }
      let d = au.diag;
      if (!DEMO) { try { d = (await api('ler', { alunoId: al.id, aulaId: au.id })).diagnostico; au.diag = d; save(db); } catch (e) { return modal('Não deu para abrir o PDF', e.message); } }
      return abrirRelatorio(d);
    }
  };
  app.oninput = ev => {
    const t = ev.target;
    if (t.dataset.f) { S.av[t.dataset.f] = t.value; return estado(); }
    if (t.dataset.gobs) { S.av.golpes[t.dataset.gobs].obs = t.value; return; }
    if (t.id === 'busca') { const q = t.value.trim().toLowerCase(); document.querySelectorAll('#lista .al').forEach(b => b.hidden = q && !b.dataset.nome.includes(q)); }
  };
  app.onchange = ev => {
    const t = ev.target;
    if (t.dataset.cb) { S.av[t.dataset.cb] = t.checked; return estado(); }
    if (t.dataset.qf !== undefined) { S.av.quadros[+t.dataset.qf].fase = t.value; return; }
    if (t.id === 'vfile' && t.files[0]) carregarVideo(t.files[0]);
  };
  app.onkeydown = ev => { if (ev.target.dataset && ev.target.dataset.q !== undefined && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); ev.target.click(); } };
}
function estado() { const e = ETAPAS[S.step]; const b = document.querySelector('.foot .b-ink'); if (b && e && S.view === 'form') b.disabled = !e.ok(S.av); }
function modal(tit, txt) {
  const m = $('#modal');
  m.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(tit)}"><div class="box"><h2>${esc(tit)}</h2><p>${esc(txt)}</p><button class="btn b-ink b-full" id="mok">Entendi</button></div></div>`;
  $('#mok').onclick = () => m.innerHTML = ''; $('#mok').focus();
}

/* Relatórios de exemplo direto: #exemplo-pdf ou #exemplo-reavaliacao */
if (location.hash === '#exemplo-pdf') abrirRelatorio(EXEMPLO, true);
else if (location.hash === '#exemplo-reavaliacao') abrirRelatorio(REAV, true);
else render();
}
</script>
